# .github/workflows/wiki.yml
# Publica la wiki de GitHub desde docs/wiki, docs/casos-de-uso y DECISIONS.md (fuente única)
name: Publicar wiki

on:
  push:
    branches: [ develop ]
    paths:
      - 'docs/**'
      - 'DECISIONS.md'
      - 'scripts/publicar_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:                # también se puede lanzar a mano desde Actions

permissions:
  contents: write                   # necesario para hacer push al repositorio de la wiki

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
      - name: Descargar la wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Generar las páginas
        run: python3 scripts/publicar_wiki.py wiki
      - name: Publicar
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "La wiki ya está al día" && exit 0
          git commit -m "docs(wiki): publicar desde ${GITHUB_SHA::7}"
          git push
